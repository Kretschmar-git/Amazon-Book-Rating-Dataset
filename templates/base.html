{% load static %}
<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Book Rating Dataset</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --neon-green: #39ff14;
            --bg-dark: #0f1115;
            --card-bg: #181b21;
        }
        body { 
            background: var(--bg-dark); 
            color: #d1d5db; 
        }
        .navbar {
            background-color: var(--card-bg) !important;
            border-bottom: 2px solid var(--neon-green);
            box-shadow: 0 4px 15px rgba(57, 255, 20, 0.1);
        }
        .navbar-brand {
            color: var(--neon-green) !important;
            text-shadow: 0 0 8px rgba(57, 255, 20, 0.4);
        }
        .nav-link:hover {
            color: var(--neon-green) !important;
        }
        .nav-link.active {
            color: var(--neon-green) !important;
            font-weight: 700;
        }
        .card { 
            background-color: var(--card-bg);
            border: 1px solid #2d333b; 
            border-radius: 16px; 
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4); 
        }
        .stat-card { 
            background: linear-gradient(135deg, #181b21 0%, #22272e 100%); 
            border-bottom: 3px solid var(--neon-green);
        }
        .stat-card h3 {
            color: var(--neon-green);
        }
        .section-title { 
            margin-top: 2rem; 
            margin-bottom: 1rem; 
            font-weight: 700; 
            color: #ffffff;
            border-left: 4px solid var(--neon-green);
            padding-left: 10px;
        }
        .table {
            --bs-table-bg: transparent;
            --bs-table-color: #d1d5db;
        }
        .table thead th { 
            background: #22272e; 
            color: var(--neon-green); 
            border-bottom: 1px solid var(--neon-green);
        }
        .table-striped>tbody>tr:nth-of-type(odd)>* {
            --bs-table-bg-type: #1c2026;
        }
        .badge-neon {
            background-color: rgba(57, 255, 20, 0.15);
            color: var(--neon-green);
            border: 1px solid var(--neon-green);
        }
        .text-neon {
            color: var(--neon-green) !important;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'home' %}#dashboard">Amazon Books</a>
            <div class="d-flex gap-3">
                <a class="nav-link text-white {% if request.path == '/' %}active{% endif %}" href="{% url 'home' %}#dashboard">Dashboard</a>
                <a class="nav-link text-white {% if request.path == '/sentimento/' %}active{% endif %}" href="{% url 'sentimento' %}">Análise de Sentimento</a>
            </div>
        </div>
    </nav>

    <main id="dashboard" class="container py-5">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
